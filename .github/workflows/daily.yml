name: Daily portal scan

on:
  schedule:
    - cron: "0 13 * * *"   # every day at 13:00 UTC (7am Central standard time, 8am daylight time)
  workflow_dispatch:
    inputs:
      refresh_rosters:
        description: "Re-scrape the ASC rosters too"
        type: boolean
        default: false
      rescan_since:
        description: "Re-read teammates' posts from this date (YYYY-MM-DD), e.g. to test image OCR. Blank = normal run"
        type: string
        default: ""
      school:
        description: "Limit the teammate scan to one school id (e.g. umhb). Blank = all"
        type: string
        default: ""

permissions:
  contents: write        # commit updated data/ and docs/ back to the repo
  issues: write          # open the daily "new players" issue, which GitHub emails you

concurrency:
  group: portal-scan     # never run two scans at once (their saved state would conflict)
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remember yesterday's tracker
        run: cp data/tracker.csv "$RUNNER_TEMP/old_tracker.csv" || true

      - name: Refresh rosters (Mondays, or when asked)
        run: |
          if [ "${{ inputs.refresh_rosters }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            python build_watchlist.py
          else
            echo "Not Monday; keeping the current watchlist."
          fi

      - name: Search X by school name and player accounts
        run: python x_search.py --max-posts 200

      - name: Install OCR (reads text in announcement graphics)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr > /dev/null

      - name: Scan teammates' reposts
        env:
          RESCAN_SINCE: ${{ inputs.rescan_since }}
          SCHOOL: ${{ inputs.school }}
        run: |
          args="--max-per-user 30"
          if [ -n "$RESCAN_SINCE" ]; then
            [[ "$RESCAN_SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "rescan_since must be YYYY-MM-DD"; exit 1; }
            args="$args --rescan --since $RESCAN_SINCE"
          fi
          if [ -n "$SCHOOL" ]; then
            [[ "$SCHOOL" =~ ^[a-z]{2,5}$ ]] || { echo "school must be an id like umhb"; exit 1; }
            args="$args --school $SCHOOL"
          fi
          python teammate_scan.py $args

      - name: Build tracker page
        run: python build_tracker.py

      - name: Commit results
        run: |
          git config user.name "portal-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily portal scan $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Email new players (via a GitHub issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python new_entries.py "$RUNNER_TEMP/old_tracker.csv" data/tracker.csv "$RUNNER_TEMP/new.md"
          if [ -s "$RUNNER_TEMP/new.md" ]; then
            {
              echo "@${{ github.repository_owner }} the daily scan found:"
              echo
              cat "$RUNNER_TEMP/new.md"
              echo
              echo "Full tracker: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
              echo
              echo "_Close this issue once you've looked. Wrong? Add a \`not_portal\` row to data/overrides.csv._"
            } > "$RUNNER_TEMP/issue.md"
            gh issue create --title "New portal entries $(date -u +%Y-%m-%d)" --body-file "$RUNNER_TEMP/issue.md"
          fi
